<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod-Em - Bedrock</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="main-header">

<div>
<a href="https://mod-em.vercel.app">
<img src="logo.png" class="logo">
    </a>
<h1 class="site-title">MOD-EM</h1>
</div>
<button onclick="goBack()" class="back">BACK</button>
</header>

<div class="filter-search">
  <div class="category-filter">
    <label for="categorySelect">category :</label>
    <select id="categorySelect" onchange="filterAddons()">
      <option value="all">All</option>
      <option value="addon">Addon</option>
      <option value="texture">Texture Pack</option>
      <option value="world">World</option>
    </select>
  </div>

  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search " oninput="filterAddons()">
  </div>
</div>

<div class="addon-wrapper">
  <div id="addons" class="addon-container">
    <!-- Addon cards akan dirender di sini -->
  </div>
</div>

<footer class="site-footer">
    <div class="footer-container">
        <!-- Bagian Kiri: Hak Cipta & Brand -->
        <div class="footer-left">
            <p>&copy; 2026 <span class="brand-name">ZeaLoTT250</span>. All rights reserved.</p>
        </div>

        <!-- Bagian Tengah: Tautan Dokumen Legal -->
        <div class="footer-links">
            <a href="https://mod-em.vercel.app/Terms-Of-Use" class="footer-link">Terms of Use</a>
            <span class="footer-separator">&bull;</span>
            <a href="https://mod-em.vercel.app/Privacy-Policy" class="footer-link">Privacy Policy</a>
        </div>

        <!-- Bagian Kanan: Ikon Sosial Media -->
        <div class="footer-socials">
            <!-- Ganti src dengan file .jpg / .png ikon sosial media Anda jika ada -->
            <a href="https://discord.gg/rCtkSA3Jet" target="_blank" aria-label="Discord" class="social-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968759.png" alt="Discord">
            </a>
            <a href="https://www.youtube.com/@Zea_LoTT" target="_blank" aria-label="YouTube" class="social-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
            </a>
        </div>
    </div>
</footer>
  
<script src="js/main.js"></script>
</body>
</html>
