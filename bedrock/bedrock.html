<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod-Em - Bedrock</title>
<link rel="stylesheet" href="/bedrock/css/style.css">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="main-header">

<div>
<a href="https://mod-em.vercel.app">
<img src="logo.png" class="logo">
    </a>
<h1 class="site-title">MOD-EM</h1>
</div>
<button onclick="goBack()" class="back">BACK</button>
</header>

<div class="filter-search">
  <div class="category-filter">
    <label for="categorySelect">category :</label>
    <select id="categorySelect" onchange="filterAddons()">
      <option value="all">All</option>
      <option value="addon">Addon</option>
      <option value="texture">Texture Pack</option>
      <option value="world">World</option>
    </select>
  </div>

  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search " oninput="filterAddons()">
  </div>
</div>

<div class="addon-wrapper">
  <div id="addons" class="addon-container">
    <!-- Addon cards akan dirender di sini -->
  </div>
</div>

<script src="/bedrock/js/main.js"></script>
</body>
</html>
